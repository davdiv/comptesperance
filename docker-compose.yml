services:
  traefik:
    image: docker.io/traefik:v3.7.18
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --log.level=INFO
      - --ping=true
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - '8080:80'
      - '8443:443'
    volumes:
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    networks:
      - comptes

  authelia:
    image: docker.io/authelia/authelia:4.39.28
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:-change-me-local-only}
      AUTHELIA_JWT_SECRET: ${AUTHELIA_JWT_SECRET:-change-me-local-only}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
    volumes:
      - ./deploy/authelia/configuration.yml:/config/configuration.yml:ro
      - ./deploy/authelia/users_database.yml:/config/users_database.yml:ro
      - authelia-data:/data
    networks:
      - comptes

  app:
    build: .
    environment:
      DATA_REPO_PATH: /data
      CACHE_DB_PATH: /cache/comptes.sqlite
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-100M}
      MAX_EVIDENCE_BYTES: ${MAX_EVIDENCE_BYTES:-26214400}
      AUTH_DISABLED: 'false'
      AUTH_LOGOUT_URL: ${AUTH_LOGOUT_URL:-https://auth.comptes.localhost:8443/logout}
      AUTH_READWRITE_GROUP: comptes-readwrite
      AUTH_READONLY_GROUP: comptes-readonly
    volumes:
      - comptes-data:/data
      - comptes-cache:/cache
    networks:
      - comptes
    depends_on:
      - authelia

volumes:
  comptes-data:
  comptes-cache:
  authelia-data:

networks:
  comptes:
