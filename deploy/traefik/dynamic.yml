http:
  routers:
    comptes-app:
      rule: HostRegexp(`^comptes\.lvh\.me(:\d+)?$`)
      entryPoints:
        - websecure
      service: comptes-app
      middlewares:
        - authelia-forwardauth
      tls: {}
    authelia-portal:
      rule: HostRegexp(`^auth\.comptes\.lvh\.me(:\d+)?$`)
      entryPoints:
        - websecure
      service: authelia
      tls: {}
  services:
    comptes-app:
      loadBalancer:
        servers:
          - url: http://app:3000
    authelia:
      loadBalancer:
        servers:
          - url: http://authelia:9091
  middlewares:
    authelia-forwardauth:
      forwardAuth:
        address: http://authelia:9091/api/verify
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Name
          - Remote-Email
