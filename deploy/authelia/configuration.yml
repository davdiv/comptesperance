theme: dark

log:
  level: info

server:
  address: 'tcp://0.0.0.0:9091'

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: bcrypt

identity_validation:
  reset_password:
    jwt_secret: ${AUTHELIA_JWT_SECRET}

session:
  secret: ${AUTHELIA_SESSION_SECRET}
  cookies:
    - domain: comptes.localhost
      authelia_url: https://auth.comptes.localhost:8443
      name: authelia_session
      same_site: lax
      expiration: 8h
      inactivity: 30m

storage:
  local:
    path: /data/db.sqlite3
  encryption_key: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}

notifier:
  filesystem:
    filename: /data/notifications.log

access_control:
  default_policy: deny
  rules:
    - domain: auth.comptes.localhost
      policy: bypass
    - domain: comptes.localhost
      policy: one_factor
