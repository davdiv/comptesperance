name: Publish container image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag for the git repository and the container image
        required: true
      update_latest:
        description: Also update the latest image tag
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        env:
          TAG: ${{ inputs.tag }}
        run: podman build --format docker --tag "$IMAGE_REPO:$TAG" .

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Tag the repository
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' ||
             ! git check-ref-format "refs/tags/$TAG"; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi
          if git ls-remote --tags origin | cut -f2 | grep -qxF "refs/tags/$TAG"; then
            echo "Tag $TAG already exists on the remote; refusing to move it." >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Push image
        env:
          TAG: ${{ inputs.tag }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail
          podman push "$IMAGE_REPO:$TAG"
          if [ "$UPDATE_LATEST" = "true" ] && [ "$TAG" != "latest" ]; then
            podman tag "$IMAGE_REPO:$TAG" "$IMAGE_REPO:latest"
            podman push "$IMAGE_REPO:latest"
          fi
