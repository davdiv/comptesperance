name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: comptes-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_BASE_URL: https://comptes.localhost:8443
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - name: Resolve local compose domains
        run: echo '127.0.0.1 comptes.localhost auth.comptes.localhost' | sudo tee -a /etc/hosts
      - name: Start a fresh stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Check non-root runtime
        run: |
          docker compose exec -T app id
          test "$(docker compose exec -T app id -u)" != 0
      - run: npm run test:e2e
      - name: Collect compose logs
        if: failure()
        run: docker compose logs --no-color > compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-e2e-failure
          path: |
            playwright-report/
            test-results/
            compose.log
          retention-days: 7
      - name: Tear down the test stack and its volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
