name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: comptes-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_BASE_URL: https://comptes.localhost:8443
      PLAYWRIGHT_CHANNEL: chrome
      PODMAN_COMPOSE_WARNING_LOGS: 'false'
      BUILDAH_FORMAT: docker
      E2E_COMPOSE_ENGINE: podman
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - name: Resolve local compose domains
        run: echo '127.0.0.1 comptes.localhost auth.comptes.localhost' | sudo tee -a /etc/hosts
      - name: Allow podman to stop pasta
        run: |
          p=/etc/apparmor.d/usr.bin.pasta
          if [ -f "$p" ] && ! sudo grep -q 'peer=podman' "$p"; then
            sudo sed -i '$ i\ signal (receive) set=(term) peer=podman,' "$p"
            sudo apparmor_parser -r -W "$p"
          fi
      - name: Start Podman socket
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          systemctl --user enable --now podman.socket
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Start a fresh stack
        run: podman compose up -d --build --wait --wait-timeout 120
      - name: Check non-root runtime
        run: |
          podman compose exec -T app id
          test "$(podman compose exec -T app id -u)" != 0
      - run: npm run test:e2e
      - name: Collect compose logs
        if: failure()
        run: podman compose logs --no-color > compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: compose-e2e-failure
          path: |
            playwright-report/
            test-results/
            compose.log
          retention-days: 7
      - name: Tear down the test stack and its volumes
        if: always()
        run: podman compose down --volumes --remove-orphans
